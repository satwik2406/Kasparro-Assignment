[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-screener"
version = "0.1.0"
description = "AI Resume Screening and Ranking System for SDE Interns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
